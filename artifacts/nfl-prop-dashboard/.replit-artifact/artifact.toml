kind = "web"
previewPath = "/"
title = "NFL Prop Matchup Dashboard"
description = "An interactive NFL player-prop research dashboard built from the uploaded matchup model. Compare player projections with career and recent-form stats, inspect opponent context, enter sportsbook lines, and review model-driven over/under leans across quarterback, running back, wide receiver, and tight end props."
version = "1.0.0"
id = "artifacts/nfl-prop-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20012

[services.development]
run = "pnpm --filter @workspace/nfl-prop-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nfl-prop-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/nfl-prop-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20012"
BASE_PATH = "/"
